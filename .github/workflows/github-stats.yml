name: Update GitHub Stats

on:
  schedule:
  - cron: '0 0 1 * *'
  workflow_dispatch:


jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate stats card
      uses: actions/github-script@v9
      with:
        script: |
          const { user } = await github.graphql(
            `query ($login: String!) {
              user(login: $login) {
                followers { totalCount }
                contributionsCollection { totalCommitContributions }
                pullRequests { totalCount }
                repositories(first: 100, privacy: PUBLIC) {
                  totalCount
                  nodes { stargazerCount }
                }
              }
            }`,
            { login: context.repo.owner },
          );

          const totalStars = user.repositories.nodes.reduce(
            (total, repository) => total + repository.stargazerCount,
            0,
          );
          const stats = [
            ['Public repositories', user.repositories.totalCount],
            ['Total stars', totalStars],
            ['Followers', user.followers.totalCount],
            ['Pull requests', user.pullRequests.totalCount],
            ['Contributions', user.contributionsCollection.totalCommitContributions],
          ];
          const rows = stats
            .map(
              ([label, value], index) =>
                `<text x="25" y="${80 + index * 21}" class="stat">${label}</text><text x="470" y="${80 + index * 21}" class="value" text-anchor="end">${value}</text>`,
            )
            .join('');

          const card = `<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">GitHub Stats</title><desc id="desc">Public GitHub statistics for ${context.repo.owner}</desc><style>.header{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#2f80ed}.stat{font:400 14px 'Segoe UI',Ubuntu,Sans-Serif;fill:#434d58}.value{font:600 14px 'Segoe UI',Ubuntu,Sans-Serif;fill:#434d58}</style><rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#fffefe" stroke="#e4e2e2"/><text x="25" y="38" class="header">GitHub Stats</text>${rows}</svg>`;
          require('fs').writeFileSync('profile/stats.svg', card);

    - name: Generate top languages card
      uses: stats-organization/github-readme-stats-action@v2
      with:
        card: top-langs
        options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
        path: profile/top-langs.svg
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_error: true

    - name: Verify generated cards
      run: |
        if grep -Eq 'Something went wrong|Resource not accessible' profile/*.svg; then
          echo "Generated an invalid GitHub stats card."
          exit 1
        fi

    - name: Commit and Push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add profile/*.svg
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "chore: update GitHub stats"
        git push
